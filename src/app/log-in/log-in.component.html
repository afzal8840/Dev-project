<app-header
[hideBtn]="true"
[loginBtn]="true"
[logoutBtn]="true"
[cartBtn]="true"
></app-header>
<section class="vh-100">
  <div class="container py-3 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col col-xl-10">
        <div class="card">
          <div class="row g-0">
            <div class="col-md-6 col-lg-5 d-none d-md-block">
              <img
                src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/img1.webp"
                alt="login form"
                class="img-fluid"
              />
            </div>
            <div class="col-md-6 align-items-center">
              <div class="card-body p-4 p-lg-5 text-black">
                <form
                  [formGroup]="login"
                  (ngSubmit)="submit()"
                  class="text-center"
                >
                  <div class="text-center mb-3 pb-1">
                    <span class="h1 text-center mb-0">Login</span>
                  </div>

                  <div
                    class="form-outline mb-4"
                    [ngClass]="{
                      'has-error':
                        (login.get('contact').errors &&
                          login.get('contact').touched) ||
                        login.get('contact').dirty
                    }"
                  >
                    <label class="form-label" for="form2Example17"
                      >Mobile Number is require</label
                    >

                    <input
                      type="number"
                      class="form-control form-control-lg"
                      formControlName="contact"
                    />
                    <span
                    class="text-danger"
                    *ngIf="
                      (login.get('contact').errors &&
                        login.get('contact').touched) ||
                      login.get('contact').dirty
                    "
                  >
                    <span *ngIf="login.get('contact').errors?.required"
                      >Mobile Number is required</span
                    >
                    <span *ngIf="login.get('contact').errors?.pattern"
                      >Please, Enter 10 digit Mobile Number</span
                    >
                  </span>
                  </div>

                  <div
                    class="form-outline mb-4"
                    [ngClass]="{
                      'has-error':
                        (login.get('password').errors &&
                          login.get('password').touched) ||
                        login.get('password').dirty
                    }"
                  >
                    <label class="form-label" for="form2Example27"
                      >Password</label
                    >

                    <input
                      type="password"
                      class="form-control form-control-lg"
                      formControlName="password"
                    />
                    <span
                      *ngIf="
                        (login.get('password').errors &&
                          login.get('password').touched) ||
                        login.get('password').dirty
                      "
                    >
                      <span
                        class="text-danger"
                        *ngIf="login.get('password').errors?.required"
                      >
                        password required
                      </span>
                      <span
                        class="text-danger"
                        *ngIf="
                          login.get('password').errors?.minlength ||
                          login.get('password').errors?.maxlength
                        "
                      >
                        password must be greater than 2 character and must be 10
                        character
                      </span>
                    </span>
                  </div>

                  <div class="pt-1 mb-4">
                    <button
                      class="btn btn-dark btn-lg btn-block"
                      type="button"
                      (click)="submit()"
                    >
                      Login
                    </button>
                  </div>

                  <p class="mb-5 pb-lg-2">
                    Don't have an account?
                    <a routerLink="/signup">Register here</a>
                  </p>
                  <a href="#!" class="small text-muted">Terms of use.</a>
                  <a href="#!" class="small text-muted">Privacy policy</a>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<app-footer></app-footer>
